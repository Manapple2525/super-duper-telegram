<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Super Duper ManaViva</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;background:#f5f4f0;color:#1a1a1a;min-height:100vh;}
#app{max-width:600px;margin:0 auto;padding:1.5rem 1rem;}
.top-title{font-size:13px;color:#888;text-align:center;margin-bottom:4px;letter-spacing:0.05em;}
.top-heading{font-size:24px;font-weight:500;text-align:center;margin-bottom:24px;}

.subject-list{display:flex;flex-direction:column;gap:10px;}

.sub-card{display:flex;align-items:center;gap:14px;border:1px solid #e0ddd6;border-radius:16px;padding:1rem 1.25rem;background:#fff;text-decoration:none;color:inherit;transition:all 0.15s;}
.sub-card:hover{border-color:#aaa;background:#faf9f7;}
.sub-card:active{transform:scale(0.99);}
.sub-icon{font-size:26px;flex-shrink:0;}
.sub-info{flex:1;}
.sub-name{font-size:15px;font-weight:500;margin-bottom:3px;}
.sub-desc{font-size:12px;color:#888;line-height:1.4;}
.sub-arrow{color:#ccc;font-size:16px;flex-shrink:0;}
</style>
</head>
<body>
<div id="app">
  <div class="top-title">STUDY APP</div>
  <div class="top-heading">Super Duper ManaViva</div>

  <div class="subject-list">
    <a class="sub-card" href="eiken3.html">
      <div class="sub-icon">📖</div>
      <div class="sub-info">
        <div class="sub-name">英検3級 単語</div>
        <div class="sub-desc">テーマ別フラッシュカード</div>
      </div>
      <span class="sub-arrow">→</span>
    </a>
    <a class="sub-card" href="irregular.html">
      <div class="sub-icon">🔀</div>
      <div class="sub-info">
        <div class="sub-name">不規則チャレンジ</div>
        <div class="sub-desc">動詞・形容詞・名詞の不規則変化</div>
      </div>
      <span class="sub-arrow">→</span>
    </a>
    <a class="sub-card" href="grammar.html">
      <div class="sub-icon">🎸</div>
      <div class="sub-info">
        <div class="sub-name">エドシーラン的文法のすゝめ</div>
        <div class="sub-desc">例文で覚える高校受験レベルの文法</div>
      </div>
      <span class="sub-arrow">→</span>
    </a>
  </div>
</div>
</body>
</html>
